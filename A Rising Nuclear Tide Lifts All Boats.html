<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A Rising Nuclear Tide Lifts All Boats</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Figtree:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #E9EDF1;
    --stage: #F7F8FA;
    --panel: #FBF8F1;
    --panel-line: #E2D3B5;
    --ink: #2B2F36;
    --ink-soft: #5D6470;
    --stone-ink: #5E5137;
    --stone-line: #8C7A5B;
    --accent: #6E5D40;
    --track: #CBD2DA;
    --focus: #3F6FB5;
    --card: #F3EAD8;
    --card-line: #E2D3B5;
    color-scheme: light;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #161A20; --stage: #1F252D; --panel: #222830; --panel-line: #3A4049;
      --ink: #E8EAED; --ink-soft: #A3AAB5; --stone-ink: #D8C29A; --stone-line: #B9A37E;
      --accent: #D8C29A; --track: #3A424D; --focus: #8FB3EA;
      --card: #2B313A; --card-line: #464D58;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --paper: #161A20; --stage: #1F252D; --panel: #222830; --panel-line: #3A4049;
    --ink: #E8EAED; --ink-soft: #A3AAB5; --stone-ink: #D8C29A; --stone-line: #B9A37E;
    --accent: #D8C29A; --track: #3A424D; --focus: #8FB3EA;
    --card: #2B313A; --card-line: #464D58;
    color-scheme: dark;
  }
  *, *::before, *::after { box-sizing: inherit; }
  html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); font-size: clamp(13px, 1.9vh, 20px); }
  body {
    margin: 0; height: 100%; overflow: hidden;
    background: var(--paper); color: var(--ink);
    font-family: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
    line-height: 1.45;
  }
  .app {
    height: 100%;
    max-width: 1500px; margin: 0 auto;
    padding: clamp(0.5rem, 1.6vh, 1rem) clamp(0.75rem, 2vw, 1.5rem);
    display: grid;
    grid-template-rows: auto minmax(0, 1fr) auto;
    gap: clamp(0.4rem, 1.2vh, 0.8rem);
  }
  h1 {
    font-family: "Cinzel", "Trajan Pro", Georgia, serif; font-weight: 700;
    font-size: clamp(1.1rem, 2.8vh, 1.7rem); letter-spacing: 0.05em;
    margin: 0; text-align: center;
  }
  .panes {
    display: grid; grid-template-columns: minmax(0, 0.92fr) minmax(0, 1.08fr);
    gap: clamp(0.6rem, 1.4vw, 1.1rem); min-height: 0;
  }
  .stage {
    background: var(--stage); border-radius: 14px;
    padding: clamp(0.4rem, 1.2vh, 0.9rem);
    display: flex; min-height: 0;
  }
  svg#scene { display: block; width: 100%; height: 100%; }
  #scene .bg { fill: var(--stage); }

  /* ---------------- slide panel ---------------- */
  .slide-pane {
    background: var(--panel); border: 1px solid var(--panel-line); border-radius: 14px;
    display: grid; grid-template-rows: minmax(0, 1fr) auto; min-height: 0; overflow: hidden;
  }
  .slide {
    padding: clamp(0.9rem, 2.4vh, 1.6rem) clamp(1rem, 2.2vw, 1.8rem);
    overflow-y: auto; min-height: 0;
    display: flex; flex-direction: column;
  }
  .slide.fade-in { animation: fadeIn 0.45s ease both; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .kicker {
    font-size: 0.72rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--ink-soft); margin: 0 0 0.25rem;
  }
  .slide h2 {
    font-family: "Cinzel", Georgia, serif; font-weight: 700;
    font-size: clamp(1.05rem, 2.6vh, 1.45rem); letter-spacing: 0.03em; line-height: 1.25;
    color: var(--stone-ink); margin: 0 0 clamp(0.6rem, 1.6vh, 1rem);
    padding-bottom: 0.5rem; border-bottom: 2px solid var(--panel-line);
  }
  .body { flex: 1; display: flex; flex-direction: column; gap: clamp(0.6rem, 1.6vh, 1rem); justify-content: center; }
  .body.top { justify-content: flex-start; }
  .subnav {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0.5rem clamp(1rem, 2.2vw, 1.8rem); border-top: 1px solid var(--panel-line);
    font-size: 0.8rem; color: var(--ink-soft);
  }
  .subdots { display: flex; gap: 0.35rem; }
  .subdots button {
    width: 0.6rem; height: 0.6rem; padding: 0; border-radius: 50%;
    border: 1.5px solid var(--stone-line); background: transparent; cursor: pointer;
  }
  .subdots button[aria-current="true"] { background: var(--accent); border-color: var(--accent); }

  /* statements and quotes */
  .statement p { font-size: clamp(1.05rem, 2.6vh, 1.4rem); line-height: 1.45; margin: 0 0 1rem; }
  .statement p:last-child { margin: 0; }
  .statement strong { color: var(--stone-ink); }
  .pull {
    font-family: "Cinzel", Georgia, serif; font-weight: 700; text-align: center;
    font-size: clamp(1.05rem, 2.7vh, 1.45rem); color: var(--stone-ink); line-height: 1.35;
    margin: 0; padding: 0.2rem 1rem;
  }
  .pull::before { content: "“"; } .pull::after { content: "”"; }
  .quote {
    margin: 0; padding: 0.4rem 0 0.4rem 1.2rem; border-left: 4px solid var(--stone-line);
    font-style: italic; font-size: clamp(0.95rem, 2.2vh, 1.15rem); line-height: 1.5;
  }
  .quote footer { font-style: normal; font-size: 0.88rem; color: var(--ink-soft); margin-top: 0.7rem; text-align: right; }

  /* source cards */
  .sources { display: grid; grid-template-columns: repeat(auto-fit, minmax(12.5rem, 1fr)); gap: 0.55rem; }
  .src {
    background: var(--card); border: 1px solid var(--card-line); border-left: 4px solid var(--tone, var(--stone-line));
    border-radius: 8px; padding: 0.5rem 0.7rem;
  }
  .src .outlet { font-size: 0.66rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-soft); }
  .src .head { font-weight: 700; font-size: 0.95rem; line-height: 1.3; margin: 0.15rem 0; }
  .src .meta { font-size: 0.72rem; color: var(--ink-soft); }

  a.src { display: block; color: inherit; text-decoration: none; transition: transform 0.15s ease, box-shadow 0.15s ease; }
  a.src:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(94,81,55,0.18); }
  a.src .head::after { content: " ↗"; color: var(--ink-soft); font-weight: 500; }
  .sources.row3 { grid-template-columns: repeat(3, 1fr); }

  /* scattered clippings */
  .collage { position: relative; flex: 1; min-height: 20rem; }
  .clip {
    position: absolute; display: block; background: #fff; padding: 0.35rem;
    border: 1px solid #E2D3B5; border-radius: 4px; box-shadow: 0 6px 18px rgba(60,48,30,0.18);
    transform: rotate(var(--r)); transition: transform 0.2s ease, box-shadow 0.2s ease; z-index: 1;
  }
  .clip img { display: block; width: 100%; height: auto; }
  .clip:hover { transform: rotate(0deg) scale(1.04); box-shadow: 0 10px 28px rgba(60,48,30,0.28); z-index: 5; }
  .clip::after {
    content: "↗"; position: absolute; top: -0.6rem; right: -0.6rem; width: 1.4rem; height: 1.4rem;
    border-radius: 50%; background: #5E5137; color: #FBF8F1; font-size: 0.75rem; display: grid; place-items: center;
    opacity: 0; transition: opacity 0.2s ease;
  }
  .clip:hover::after { opacity: 1; }

  /* image pair + tall image */
  .imgs3 { display: grid; grid-template-columns: 1fr 0.8fr; gap: 0.9rem; align-items: center; flex: 1; min-height: 0; }
  .imgs3 .col { display: flex; flex-direction: column; gap: 0.9rem; }
  .imgs3 .clip { position: static; --r: 0deg; }
  .imgs3 .clip img { max-height: 46vh; object-fit: contain; }

  /* bullets */
  ul.pts { margin: 0; padding-left: 1.1rem; font-size: clamp(0.9rem, 2.1vh, 1.05rem); }
  ul.pts li { margin: 0.3rem 0; }
  ul.pts li::marker { color: var(--stone-line); }
  ul.pts ul { padding-left: 1.1rem; margin: 0.2rem 0; }
  .lead { font-weight: 700; color: var(--stone-ink); }

  /* export race */
  .lane {
    display: grid; grid-template-columns: 3.4rem 1fr 7.5rem; gap: 0.8rem; align-items: center;
    background: var(--lane); border-radius: 10px; padding: 0.6rem 0.8rem;
  }
  .lane ul { margin: 0; padding-left: 1rem; font-size: 0.92rem; color: #33363b; }
  .lane .flag { width: 3.2rem; height: auto; border: 1px solid rgba(0,0,0,0.15); border-radius: 2px; }
  .verdict { font-weight: 700; color: var(--vc); display: flex; flex-direction: column; gap: 0.35rem; }
  .bar { height: 6px; border-radius: 3px; background: color-mix(in srgb, var(--vc) 25%, transparent); position: relative; }
  .bar span { position: absolute; inset: 0 auto 0 0; border-radius: 3px; background: var(--vc); }

  .race { flex: 1; display: flex; flex-direction: column; gap: 0.8rem; }
  .race .lane { flex: 1; grid-template-columns: 6rem 1fr 9.5rem; gap: 1.2rem; padding: 0.9rem 1.2rem; border-radius: 14px; }
  .race .lane .flag { width: 5.6rem; }
  .race .lane ul { font-size: 1.12rem; line-height: 1.55; }
  .race .verdict { font-size: 1.25rem; gap: 0.55rem; }
  .race .bar { height: 8px; }

  /* tiles */
  .tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.55rem; }
  .tile {
    background: var(--card); border: 1px solid var(--card-line); border-radius: 10px;
    padding: 1.1rem 0.6rem; text-align: center; font-weight: 700; font-size: 0.95rem; min-height: 5.2rem; justify-content: center; line-height: 1.3;
    display: flex; flex-direction: column; align-items: center; gap: 0.4rem;
  }
  .tile svg { display: none; }
  .tile.hot { background: #F6CFCF; border-color: #E9AFAF; color: #7A2E2E; }

  /* grouped points with sources aside */
  .split { display: grid; grid-template-columns: 1.35fr 1fr; gap: 1rem; align-items: start; }
  .group h3 { font-size: 0.95rem; margin: 0 0 0.2rem; color: var(--stone-ink); }
  .group + .group { margin-top: 0.6rem; padding-top: 0.6rem; border-top: 1px dashed var(--panel-line); }
  .stack { display: flex; flex-direction: column; gap: 0.55rem; }

  /* dials */
  .dials { display: flex; flex-direction: column; gap: 0.35rem; }
  .dial-row { display: flex; align-items: center; gap: 0.9rem; font-size: clamp(0.9rem, 2.1vh, 1.05rem); }
  .dial-row svg { width: 4rem; height: auto; flex: none; }
  .legend { font-size: 0.78rem; color: var(--ink-soft); }

  /* scatter schematic */
  .scatter svg { width: 100%; height: auto; max-height: 42vh; }
  .scatter a { color: var(--focus); }

  /* filling layouts */
  .sources.pin-bottom { margin-top: auto; padding-top: 0.8rem; }
  .dials.fill { flex: 1; justify-content: space-evenly; gap: 0.3rem; }
  .dials.fill .dial-row { font-size: clamp(1.05rem, 2.7vh, 1.45rem); gap: 1.4rem; }
  .dials.fill .dial-row svg { width: clamp(4.5rem, 9vh, 6.5rem); }
  .statement.big ul.pts { font-size: clamp(1.05rem, 2.45vh, 1.35rem); line-height: 1.4; }
  .statement.big ul.pts li { margin: 0.5rem 0; }
  .tilegroups { flex: 1; display: flex; flex-direction: column; justify-content: space-evenly; gap: 1.4rem; }
  .tilegroup h3 { margin: 0 0 0.6rem; font-family: "Cinzel", Georgia, serif; font-size: 0.95rem; letter-spacing: 0.06em; color: #7A2E2E; text-align: center; }
  .tiles.row3 { grid-template-columns: repeat(3, 1fr); gap: 1rem; width: 82%; margin: 0 auto; }
  .tiles.row5 { grid-template-columns: repeat(5, 1fr); gap: 0.8rem; }
  .tilegroups .tile { min-height: 7rem; font-size: 1rem; }
  .tilegroup.frontier { background: rgba(246,207,207,0.25); border: 1.5px dashed #E9AFAF; border-radius: 14px; padding: 0.9rem; }

  /* sub-page dots on the story axis */
  .minidots { display: flex; gap: 4px; height: 6px; align-items: center; }
  .minidots i { width: 6px; height: 6px; border-radius: 50%; background: var(--track); }
  .minidots i.seen { background: color-mix(in srgb, var(--accent) 45%, var(--track)); }
  .minidots i.on { background: var(--accent); transform: scale(1.3); }

  /* priorities */
  .prio { display: grid; grid-template-columns: 1fr 2rem 0.85fr; gap: 0.6rem 0.5rem; align-items: stretch; flex: 1; grid-template-rows: auto repeat(6, 1fr); }
  .prio > div { display: flex; flex-direction: column; justify-content: center; }
  .prio .colhead { font-size: 0.68rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-soft); text-align: center; }
  .prio .p { background: #5E5137; color: #FBF8F1; border-radius: 10px; padding: 0.5rem 0.8rem; font-weight: 700; font-size: 1.02rem; text-align: center; }
  .prio .s { background: var(--card); border: 1.5px solid var(--stone-line); color: var(--stone-ink); border-radius: 10px; padding: 0.5rem 0.8rem; font-weight: 700; font-size: 1.02rem; text-align: center; }
  .prio .s small { display: block; font-weight: 500; font-size: 0.75rem; color: var(--ink-soft); font-style: italic; }
  .prio .arrow { color: var(--stone-line); align-items: center; font-size: 1.4rem; }
  .prio .colhead { justify-content: flex-end; }

  /* twofold */
  .banner { background: #5E5137; color: #FBF8F1; border-radius: 10px; text-align: center; padding: 0.7rem; font-weight: 700; font-size: clamp(0.95rem, 2.3vh, 1.15rem); }
  .twofold { display: grid; grid-template-columns: 1fr auto 1fr; gap: 0.6rem; align-items: stretch; }
  .twofold .card { background: var(--card); border: 1px solid var(--card-line); border-radius: 10px; padding: 0.8rem 0.9rem; }
  .twofold h3 { margin: 0 0 0.4rem; font-size: 1rem; color: var(--stone-ink); }
  .plus { align-self: center; width: 2rem; height: 2rem; border-radius: 50%; background: var(--accent); color: var(--panel); display: grid; place-items: center; font-weight: 700; font-size: 1.2rem; }
  .note { text-align: center; font-style: italic; color: var(--ink-soft); font-size: 0.92rem; margin: 0; }

  /* rising steps */
  .rise { position: relative; flex: 1; display: flex; align-items: center; min-height: 20rem; }
  .rise > svg { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0; }
  .steps3 { position: relative; z-index: 1; display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.8rem; align-items: start; width: 100%; padding-bottom: 4.5rem; }
  .step3 { background: var(--card); border: 1px solid var(--card-line); border-radius: 10px; overflow: hidden; min-height: 13.5rem; box-shadow: 0 4px 14px rgba(60,48,30,0.10); }
  .step3:nth-child(1) { transform: translateY(4.4rem); } .step3:nth-child(2) { transform: translateY(2.2rem); }
  .step3 header { background: #5E5137; color: #FBF8F1; padding: 0.5rem 0.7rem; font-weight: 700; font-size: 0.92rem; display: flex; gap: 0.5rem; align-items: center; }
  .step3 header b { width: 1.4rem; height: 1.4rem; border-radius: 50%; background: #FBF8F1; color: #5E5137; display: grid; place-items: center; font-size: 0.75rem; flex: none; }
  .step3 div { padding: 0.6rem 0.7rem; font-size: 0.88rem; }
  .chip { display: block; background: #CDEBD3; color: #2E5B3E; border-radius: 6px; padding: 0.15rem 0.5rem; margin-top: 0.35rem; font-size: 0.8rem; font-weight: 500; text-align: center; }

  /* ---------------- controls ---------------- */
  .bottom { display: flex; flex-direction: column; align-items: center; gap: 0.45rem; }
  .controls { display: flex; justify-content: center; gap: 0.6rem; }
  button.ctl {
    font: inherit; font-weight: 500; color: var(--ink); background: transparent;
    border: 1.5px solid var(--stone-line); border-radius: 999px; padding: 0.4rem 1.1rem; cursor: pointer;
  }
  button.ctl:hover { background: color-mix(in srgb, var(--stone-line) 14%, transparent); }
  button.ctl.primary { background: var(--accent); border-color: var(--accent); color: var(--stage); }
  button.ctl:disabled { opacity: 0.4; cursor: default; }
  button:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  .steps {
    list-style: none; padding: 0; margin: 0; width: 100%; max-width: 900px;
    display: grid; grid-template-columns: repeat(5, 1fr); gap: 0.25rem; position: relative;
  }
  .steps::before { content: ""; position: absolute; left: 10%; right: 10%; top: 0.62rem; height: 2px; background: var(--track); }
  .steps button {
    border: none; background: none; padding: 0; width: 100%; cursor: pointer; font: inherit;
    display: flex; flex-direction: column; align-items: center; gap: 0.3rem;
    font-size: 0.8rem; color: var(--ink-soft); position: relative;
  }
  .steps button:hover { color: var(--ink); }
  .dot {
    width: 1.25rem; height: 1.25rem; border-radius: 50%; background: var(--stage);
    border: 2px solid var(--track); display: grid; place-items: center;
    font-size: 0.68rem; font-weight: 700; color: var(--ink-soft);
  }
  .steps button[aria-current="step"] { color: var(--ink); font-weight: 700; }
  .steps button[aria-current="step"] .dot { background: var(--accent); border-color: var(--accent); color: var(--stage); }

  @media (max-width: 860px) {
    body { overflow: auto; }
    .app { height: auto; min-height: 100%; }
    .panes { grid-template-columns: 1fr; }
    .stage { height: 38vh; }
    .split, .twofold, .steps3 { grid-template-columns: 1fr; }
    .plus { justify-self: center; }
    .step3:nth-child(n) { transform: none; } .rise > svg { display: none; } .steps3 { padding-bottom: 0; }
    .tiles, .tiles.row3, .tiles.row5 { grid-template-columns: repeat(2, 1fr); width: 100%; }
    .sources.row3 { grid-template-columns: 1fr; }
    .collage { min-height: 34rem; }
    .steps .name { display: none; }
  }
</style>
</head>
<body>
<div class="app">
  <h1>A Rising Nuclear Tide Lifts All Boats</h1>

  <div class="panes">
    <div class="stage">
      <svg id="scene" viewBox="-6 -7.95 12 8.7" role="img" aria-label="A temple representing the NPT"></svg>
    </div>
    <section class="slide-pane" aria-live="polite">
      <article class="slide" id="slide"></article>
      <div class="subnav">
        <span id="subcount"></span>
        <div class="subdots" id="subdots"></div>
      </div>
    </section>
  </div>

  <div class="bottom">
    <div class="controls">
      <button id="prev" type="button" class="ctl">Back</button>
      <button id="play" type="button" class="ctl primary">Play</button>
      <button id="next" type="button" class="ctl">Next</button>
    </div>
    <ol class="steps" id="steps"></ol>
  </div>
</div>

<script>
(() => {
  // ================================================================ temple stages
  const STAGES = [
    { name: "The Ideal NPT", p: {} },
    { name: "The NPT Today", p: { dCrack: 1, npSmall: 1, scaffold: 1 } },
    { name: "China’s Obfuscation", p: { dCrack: 1, npSmall: 1, curtain: 1, scaffold: 1 } },
    { name: "The Export Race", p: { tilt: 9, bloat: 1, dCrack: 1, snap: 1, npSmall: 1, npBig: 1, drop: 1, heap: 1, strain: 1 } },
    { name: "US Dominance", p: { strong: 1, dCrack: 1, buttress: 1 } },
  ];
  const KEYS = ["tilt","bloat","strong","dCrack","snap","npSmall","npBig","scaffold","curtain","drop","heap","strain","buttress"];
  const full = i => Object.fromEntries(KEYS.map(k => [k, STAGES[i].p[k] || 0]));

  // ---------------------------------------------------------------- palette
  const C = {
    stone: "#F3EAD8", stoned: "#E2D3B5", ol: "#8C7A5B", crack: "#6F5F45",
    blue: "#C9DBF2", blueS: "#B3CBEE", mint: "#CDEBD3", rose: "#F6CFCF", roseS: "#F1B9B9",
    fred: "#E0473C", fredD: "#8F2E27", fyel: "#FFDE5A", rod: "#8A6A4A",
    steel: "#AEB7C1", steeld: "#6B7682", usred: "#D24B4B", usblue: "#3D5291",
    plank: "#DDBF8F", plankd: "#A9875A", bucket: "#F2C46D", label: "#4A4A4A",
  };
  const mix = (a, b, t) => {
    const pa = [1,3,5].map(i => parseInt(a.slice(i, i+2), 16));
    const pb = [1,3,5].map(i => parseInt(b.slice(i, i+2), 16));
    return "#" + pa.map((v, i) => Math.round(v + (pb[i] - v) * t).toString(16).padStart(2, "0")).join("");
  };

  // ---------------------------------------------------------------- svg helpers (math coords, y up)
  const f = n => (+n).toFixed(3);
  const P = pts => "M" + pts.map(p => f(p[0]) + " " + f(p[1])).join("L") + "Z";
  const L = pts => "M" + pts.map(p => f(p[0]) + " " + f(p[1])).join("L");
  const SW = 0.035;
  const path = (d, fill, stroke = C.ol, sw = SW, extra = "") =>
    `<path d="${d}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}" stroke-linejoin="round" ${extra}/>`;
  const rect = (x1, y1, x2, y2, fill, stroke = C.ol, sw = SW, extra = "") =>
    `<rect x="${f(Math.min(x1,x2))}" y="${f(Math.min(y1,y2))}" width="${f(Math.abs(x2-x1))}" height="${f(Math.abs(y2-y1))}" rx="0.04" fill="${fill}" stroke="${stroke}" stroke-width="${sw}" ${extra}/>`;
  const line = (pts, stroke, sw, extra = "") =>
    `<path d="${L(pts)}" fill="none" stroke="${stroke}" stroke-width="${sw}" stroke-linejoin="round" stroke-linecap="round" ${extra}/>`;
  const circ = (x, y, r, fill, extra = "") => `<circle cx="${f(x)}" cy="${f(y)}" r="${f(r)}" fill="${fill}" ${extra}/>`;
  const text = (x, y, str, { size = 0.24, rot = 0, fill = C.label, weight = 700, family = "Figtree, system-ui, sans-serif", spacing = 0, extra = "" } = {}) =>
    `<g transform="translate(${f(x)} ${f(y)}) scale(1 -1) rotate(${rot})"><text text-anchor="middle" dominant-baseline="central" font-family="${family}" font-weight="${weight}" font-size="${size}" letter-spacing="${spacing}" fill="${fill}" ${extra}>${str}</text></g>`;
  const star = (cx, cy, R, rot = 0) => {
    const pts = [];
    for (let k = 0; k < 10; k++) {
      const a = (90 + rot + k * 36) * Math.PI / 180, r = k % 2 ? R * 0.382 : R;
      pts.push([cx + r * Math.cos(a), cy + r * Math.sin(a)]);
    }
    return pts;
  };
  const smoothClosed = pts => {
    const n = pts.length; let d = `M${f(pts[0][0])} ${f(pts[0][1])}`;
    for (let i = 0; i < n; i++) {
      const p0 = pts[(i - 1 + n) % n], p1 = pts[i], p2 = pts[(i + 1) % n], p3 = pts[(i + 2) % n];
      const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6];
      const c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
      d += `C${f(c1[0])} ${f(c1[1])} ${f(c2[0])} ${f(c2[1])} ${f(p2[0])} ${f(p2[1])}`;
    }
    return d + "Z";
  };
  const op = v => `opacity="${f(Math.max(0, Math.min(1, v)))}"`;

  // ---------------------------------------------------------------- static pieces
  // Flag curtain (Chinese flag), 30 x 20 grid, u = 0.15
  const U = 0.15, FL = -3.75, FT = 4.65, FB = 1.62;
  const curtainPts = (() => {
    const pts = [[FL, FT], [FL + 30 * U, FT], [FL + 30 * U + 0.05, FB]];
    for (let i = 0; i <= 60; i++) {
      const x = FL + 30 * U + 0.05 - i * (30 * U + 0.1) / 60;
      pts.push([x, FB + 0.06 * Math.sin(x * 480 * Math.PI / 180)]);
    }
    return pts;
  })();
  const heapPts = [[-4.3,-0.12],[-2.5,-0.2],[-0.5,-0.17],[0.95,-0.1],[1.1,0.15],[0.75,0.36],[0.2,0.3],
                   [-0.3,0.56],[-0.9,0.4],[-1.5,0.64],[-2.2,0.45],[-2.9,0.72],[-3.6,0.5],[-4.25,0.4]];
  // US-flag drape under the left buttress beam
  const BF = [-5.35, 0], BT = [-3.72, 4.4];
  const along = t => [BF[0] + (BT[0] - BF[0]) * t, BF[1] + (BT[1] - BF[1]) * t];
  const drapePts = (() => {
    const pts = [[-3.65, 4.12], along(0.96), along(0.27), [-4.95, 0.72]];
    for (let i = 0; i <= 40; i++) {
      const x = -4.95 + i * 1.3 / 40;
      pts.push([x, 0.72 + (x + 4.95) * 0.36 + 0.05 * Math.sin(x * 700 * Math.PI / 180)]);
    }
    return pts;
  })();

  const DEFS = `<defs>
    <clipPath id="clipCurtain" clipPathUnits="userSpaceOnUse"><path d="${P(curtainPts)}"/></clipPath>
    <clipPath id="clipHeap" clipPathUnits="userSpaceOnUse"><path d="${smoothClosed(heapPts)}"/></clipPath>
    <clipPath id="clipDrape" clipPathUnits="userSpaceOnUse"><path d="${P(drapePts)}"/></clipPath>
    <clipPath id="clipPU" clipPathUnits="userSpaceOnUse"><rect x="2.3" y="1.2" width="1.2" height="3.4"/></clipPath>
  </defs>`;

  // ---------------------------------------------------------------- render
  function render(s) {
    const tt = Math.tan(s.tilt * Math.PI / 180);
    const yTop = x => 4.6 + tt * (x + 2.9) + 0.04;
    const strongSW = SW * (1 + 0.35 * s.strong);
    // scaffolding fades out quickly so it never lingers around the swelling pillar
    const scOp = op(Math.pow(s.scaffold, 3));
    let o = "";

    // steps
    o += rect(-4.8, 0, 4.8, 0.45, C.stoned);
    o += rect(-4.4, 0.45, 4.4, 0.9, C.stone);

    // scaffold ledgers (behind the pillar)
    if (s.scaffold > 0.001) {
      let g = "";
      for (const y of [1.5, 2.7, 3.9]) {
        g += line([[1.75, y], [4.05, y]], C.steeld, 0.07);
        g += line([[1.75, y], [4.05, y]], C.steel, 0.035);
      }
      o += `<g ${scOp}>${g}</g>`;
    }

    // --- Pillar 1: Nonproliferation
    const npHW = 0.6 + 0.15 * s.strong, npX = -2.9;
    o += rect(npX - npHW - 0.2, 0.9, npX + npHW + 0.2, 1.2, C.stoned, C.ol, strongSW);
    o += path(P([[npX - npHW, 1.2], [npX + npHW, 1.2], [npX + npHW, yTop(npX + npHW)], [npX - npHW, yTop(npX - npHW)]]),
              mix(C.blue, C.blueS, s.strong), C.ol, strongSW);
    for (const dx of [-1, 1]) o += line([[npX + dx * (npHW - 0.18), 1.35], [npX + dx * (npHW - 0.18), yTop(npX + dx * (npHW - 0.18)) - 0.1]], "#BFB29A", 0.018);
    o += text(npX, 2.85, "Nonproliferation", { rot: -90 });
    if (s.npSmall > 0.001) {
      o += `<g ${op(s.npSmall)}>` +
        line([[-3.5,4.4],[-3.36,4.25],[-3.42,4.08],[-3.27,3.9]], C.crack, 0.022) +
        line([[-3.36,4.25],[-3.24,4.32]], C.crack, 0.016) +
        line([[-2.3,3.2],[-2.44,3.05],[-2.38,2.88],[-2.5,2.72]], C.crack, 0.022) +
        line([[-2.3,1.55],[-2.42,1.45],[-2.36,1.34],[-2.48,1.25]], C.crack, 0.022) + `</g>`;
    }
    if (s.npBig > 0.001) {
      o += `<g ${op(s.npBig)}>` +
        line([[-3.5,4.5],[-3.33,4.28],[-3.42,4.02],[-3.28,3.76],[-3.39,3.46],[-3.3,3.18],[-3.4,2.9]], C.crack, 0.03) +
        line([[-2.3,4.68],[-2.46,4.42],[-2.38,4.16],[-2.53,3.9],[-2.43,3.6],[-2.55,3.3],[-2.45,3.05]], C.crack, 0.03) +
        line([[-2.43,3.6],[-2.3,3.5]], C.crack, 0.02) + `</g>`;
    }

    // --- Pillar 2: Disarmament (lower piece; upper piece rides with the roof)
    const J = [[0.6,3.7],[0.45,3.82],[0.25,3.64],[0.05,3.8],[-0.15,3.62],[-0.35,3.78],[-0.6,3.68]];
    o += rect(-0.8, 0.9, 0.8, 1.2, C.stoned);
    o += path(P([[-0.6, 1.2], [0.6, 1.2], ...J]), C.mint, "none", 0);
    o += line([[-0.6, 3.68], [-0.6, 1.2], [0.6, 1.2], [0.6, 3.7]], C.ol, SW);
    o += line(J, C.ol, SW, op(s.snap));
    for (const dx of [-0.42, 0.42]) o += line([[dx, 1.35], [dx, 3.6]], "#BFB29A", 0.018);
    o += text(-0.03, 2.62, "Disarmament", { rot: -90 });
    if (s.dCrack > 0.001) {
      o += `<g ${op(s.dCrack)}>` +
        line([[0.35,3.7],[0.33,3.4],[0.48,3.0],[0.36,2.55],[0.48,2.15],[0.22,1.8],[-0.08,1.72],[-0.3,1.5],[-0.6,1.42]], C.crack, 0.035) +
        line([[0.48,3.0],[0.6,2.92]], C.crack, 0.022) +
        line([[-0.3,1.5],[-0.22,1.3]], C.crack, 0.022) + `</g>`;
    }
    if (s.snap > 0.001) {
      o += `<g ${op(s.snap)}>` + line([[-0.35,3.78],[-0.4,3.55],[-0.32,3.35],[-0.45,3.15]], C.crack, 0.022) + `</g>`;
    }

    // --- Pillar 3: Peaceful Use
    const b = s.bloat, puX = 2.9 + 0.2 * b;
    const hb = 0.6 + 0.25 * b + 0.15 * s.strong, ht = 0.6 + 0.3 * b + 0.15 * s.strong, bulge = 0.6 * b;
    const baseTop = 1.2 + 0.1 * b;
    o += rect(puX - hb - 0.2 - 0.1 * b, 0.9, puX + hb + 0.2 + 0.1 * b, baseTop, C.stoned, C.ol, strongSW);
    const puD = `M${f(puX - hb)} ${f(baseTop)}` +
      `C${f(puX - hb - bulge)} ${f(2.6)} ${f(puX - ht - bulge)} ${f(4.1)} ${f(puX - ht)} ${f(yTop(puX - ht))}` +
      `L${f(puX + ht)} ${f(yTop(puX + ht))}` +
      `C${f(puX + ht + bulge)} ${f(4.1)} ${f(puX + hb + bulge)} ${f(2.6)} ${f(puX + hb)} ${f(baseTop)}Z`;
    o += path(puD, mix(C.rose, C.roseS, s.strong), C.ol, strongSW);
    for (const dx of [-1, 1]) {
      const xb = puX + dx * (hb - 0.2), xt = puX + dx * (ht - 0.2);
      o += `<path d="M${f(xb)} ${f(baseTop + 0.15)}C${f(xb + dx * bulge * 0.9)} 2.6 ${f(xt + dx * bulge * 0.9)} 4.1 ${f(xt)} ${f(yTop(xt) - 0.12)}" fill="none" stroke="#C9B6A6" stroke-width="0.018"/>`;
    }
    if (b > 0.001) o += `<ellipse cx="${f(puX - ht - bulge * 0.35 + 0.22)}" cy="3.4" rx="0.11" ry="1.0" fill="#fff" ${op(0.45 * b)}/>`;
    // masonry with vacant slots while under construction
    if (s.scaffold > 0.001) {
      let g = "";
      for (let i = 1; i <= 9; i++) g += line([[2.3, 1.2 + i * 0.34], [3.5, 1.2 + i * 0.34]], "#BFA99A", 0.014);
      for (let i = 0; i <= 9; i++) {
        const yb = 1.2 + i * 0.34;
        for (const x of (i % 2 ? [2.5, 2.9, 3.3] : [2.7, 3.1])) g += line([[x, yb], [x, yb + 0.34]], "#BFA99A", 0.014);
      }
      for (const [i, xl, xr] of [[9,2.3,2.7],[9,3.1,3.5],[8,2.3,2.5],[8,3.3,3.5],[7,3.3,3.5],[6,3.1,3.5],[4,2.3,2.7],[3,3.3,3.5]]) {
        const y = 1.2 + i * 0.34;
        g += rect(xl + 0.03, y + 0.03, xr - 0.03, y + 0.31, "#D9CFC0", "#8C7A5B", 0.016, 'stroke-dasharray="0.05 0.04"');
      }
      o += `<g clip-path="url(#clipPU)" ${scOp}>${g}</g>`;
      o += `<rect x="2.73" y="2.0" width="0.34" height="1.8" rx="0.03" fill="${C.rose}" ${scOp}/>`;
    }
    o += text(puX, 2.9 + 0.5 * b, "Peaceful Use", { rot: -90, size: 0.24 + 0.08 * b });

    // --- Roof group (rotates about the left capital)
    let r = "";
    r += rect(-2.9 - npHW - 0.2, 4.6, -2.9 + npHW + 0.2, 4.9, C.stoned, C.ol, strongSW);
    r += rect(-0.8, 4.6, 0.8, 4.9, C.stoned);
    r += rect(puX - ht - 0.25 - 0.1 * b, 4.6, puX + ht + 0.25 + 0.05 * b, 4.9, C.stoned, C.ol, strongSW);
    // chip in disarmament capital
    r += `<path d="${P([[0.48,4.6],[0.62,4.78],[0.8,4.72],[0.8,4.6]])}" class="bg" stroke="${C.ol}" stroke-width="${SW}" ${op(s.dCrack)}/>`;
    r += `<path d="${P([[-3.7,4.6],[-3.55,4.74],[-3.42,4.6]])}" class="bg" stroke="${C.ol}" stroke-width="${SW}" ${op(s.npBig)}/>`;
    // upper disarmament piece
    r += path(P([...[...J].reverse(), [0.6, 4.6], [-0.6, 4.6]]), C.mint, "none", 0);
    r += line([[-0.6, 3.68], [-0.6, 4.6]], C.ol, SW) + line([[0.6, 3.7], [0.6, 4.6]], C.ol, SW);
    r += line(J, C.ol, SW, op(s.snap));
    for (const dx of [-0.42, 0.42]) r += line([[dx, 3.8], [dx, 4.5]], "#BFB29A", 0.018);
    if (s.dCrack > 0.001) {
      r += `<g ${op(s.dCrack)}>` +
        line([[-0.6,4.35],[-0.38,4.15],[-0.22,4.28],[0.05,4.1],[0.36,3.85],[0.35,3.7]], C.crack, 0.035) +
        line([[0.05,4.1],[0.2,4.25],[0.38,4.3],[0.6,4.5]], C.crack, 0.022) + `</g>`;
    }
    // entablature + pediment
    r += rect(-4.4, 4.9, 4.4, 5.5, C.stone);
    for (let x = -3.6; x <= 3.7; x += 1.2) r += rect(x - 0.2, 5.05, x + 0.2, 5.35, C.stoned);
    r += path(P([[-4.8, 5.5], [4.8, 5.5], [0, 7.0]]), C.stoned);
    r += path(P([[-3.9, 5.7], [3.9, 5.7], [0, 6.75]]), C.stone);
    // carved NPT
    const npt = "N P T";
    r += text(0.025, 6.085, npt, { size: 0.5, family: "Cinzel, Georgia, serif", fill: "#ffffff", spacing: 0.06 });
    r += text(-0.022, 6.132, npt, { size: 0.5, family: "Cinzel, Georgia, serif", fill: "#5E5137", spacing: 0.06 });
    r += text(0, 6.11, npt, { size: 0.5, family: "Cinzel, Georgia, serif", fill: mix(C.stoned, C.ol, 0.15), spacing: 0.06 });
    o += `<g transform="rotate(${f(s.tilt)} -2.9 4.9)">${r}</g>`;

    // --- Scaffold front, sign
    if (s.scaffold > 0.001) {
      let g = "";
      for (const x of [1.75, 4.05]) {
        g += line([[x, 0.9], [x, 4.5]], C.steeld, 0.085) + line([[x, 0.92], [x, 4.48]], C.steel, 0.045);
      }
      for (const [a, c] of [[1.75, 2.3], [4.05, 3.5]]) {
        g += line([[a, 1.5], [c, 2.7], [a, 3.9]], C.steeld, 0.055) + line([[a, 1.5], [c, 2.7], [a, 3.9]], C.steel, 0.025);
      }
      for (const x of [1.75, 4.05]) for (const y of [1.5, 2.7, 3.9]) g += circ(x, y, 0.06, C.steeld);
      for (const y of [1.5, 4.15]) {
        g += rect(1.6, y, 4.2, y + 0.13, C.plank, C.plankd, 0.025);
        g += line([[2.45, y], [2.45, y + 0.13]], C.plankd, 0.014) + line([[3.35, y], [3.35, y + 0.13]], C.plankd, 0.014);
      }
      g += path(P([[3.62,1.63],[3.92,1.63],[3.97,1.95],[3.57,1.95]]), C.bucket, C.ol, 0.025);
      g += `<path d="M3.6 1.95C3.65 2.15 3.89 2.15 3.94 1.95" fill="none" stroke="${C.ol}" stroke-width="0.02"/>`;
      g += rect(1.9, 1.63, 2.3, 1.85, C.rose, C.ol, 0.025) + rect(1.95, 1.85, 2.25, 2.05, C.rose, C.ol, 0.025);
      // sign
      for (const x of [2.2, 3.6]) g += rect(x - 0.06, 0.62, x + 0.06, 1.0, C.plankd, "#6E5636", 0.025);
      let sg = rect(1.5, 0.98, 4.3, 1.4, C.plank, "#6E5636", 0.03);
      sg += `<path d="M1.6 1.05C2.5 1.08 3.3 1.02 4.2 1.06" fill="none" stroke="#C2A272" stroke-width="0.014"/>`;
      for (const [x, y] of [[1.57,1.05],[4.23,1.05],[1.57,1.33],[4.23,1.33]]) sg += circ(x, y, 0.028, "#5A4630");
      sg += text(2.9, 1.2, "Under construction", { size: 0.2, fill: "#5A4630" });
      g += `<g transform="rotate(-2 2.9 1.19)">${sg}</g>`;
      g += `<path d="M1.55 1.36C1.55 1.5 1.7 1.62 1.75 1.68M4.25 1.32C4.22 1.48 4.1 1.6 4.05 1.66" fill="none" stroke="#6E5636" stroke-width="0.022"/>`;
      o += `<g ${scOp}>${g}</g>`;
    }

    // --- strain marks and debris
    if (s.strain > 0.001) {
      let g = "";
      for (const sgn of [-1, 1]) {
        const x0 = -2.9 + sgn * 0.95;
        g += line([[x0, 4.35], [x0 + sgn * 0.3, 4.45]], "#6E5F45", 0.025);
        g += line([[x0, 4.15], [x0 + sgn * 0.35, 4.15]], "#6E5F45", 0.025);
        g += line([[x0, 3.95], [x0 + sgn * 0.3, 3.85]], "#6E5F45", 0.025);
      }
      o += `<g ${op(s.strain)}>${g}</g>`;
    }
    if (s.snap > 0.001) {
      o += `<g ${op(s.snap)}>` +
        path(P([[0.8,3.75],[0.92,3.86],[1.02,3.78],[0.95,3.7]]), C.mint, C.ol, 0.025) +
        path(P([[0.95,3.3],[1.03,3.38],[1.1,3.31]]), C.mint, C.ol, 0.025) +
        path(P([[1.0,0.9],[1.15,1.06],[1.3,0.97],[1.25,0.9]]), C.stoned, C.ol, 0.025) +
        circ(-0.85, 3.95, 0.06, "#C9BFAE") + circ(0.85, 4.25, 0.06, "#C9BFAE") + circ(-0.95, 4.3, 0.06, "#C9BFAE") + `</g>`;
    }

    // --- Buttresses draped in the US flag
    if (s.buttress > 0.001) {
      let g = "";
      let d = "";
      const h = (4.12 - 0.6) / 13;
      for (let i = 0; i < 13; i++) d += rect(-5.2, 4.12 - (i + 1) * h, -3.6, 4.12 - i * h, i % 2 ? "#ffffff" : C.usred, "none", 0);
      d += rect(-4.55, 4.12 - 7 * h, -3.6, 4.2, C.usblue, "none", 0);
      for (let rr = 0; rr <= 6; rr++) for (let c = 0; c <= 3; c++)
        d += circ(-3.78 - c * 0.2 - (rr % 2) * 0.1, 4.0 - rr * 0.24, 0.035, "#fff");
      for (const x of [-4.55, -4.15])
        d += `<path d="M${f(x + 0.25)} 4.2Q${f(x + 0.05)} 2.5 ${f(x - 0.08)} 0.5L${f(x + 0.12)} 0.5Q${f(x + 0.2)} 2.5 ${f(x + 0.4)} 4.2Z" fill="#000" opacity="0.12"/>`;
      g += `<g clip-path="url(#clipDrape)">${d}</g>`;
      g += path(P(drapePts), "none", "#6E5F45", 0.028);
      g += line([BF, BT], C.steeld, 0.17) + line([BF, BT], C.steel, 0.12);
      g += line([along(0.02), along(0.98)], C.steeld, 0.018);
      for (let t = 0.1; t < 0.96; t += 0.12) { const p = along(t); g += circ(p[0], p[1], 0.035, C.steeld); }
      g += rect(-5.75, -0.1, -4.95, 0.06, C.steel, C.steeld, 0.025);
      g += circ(-5.62, -0.02, 0.04, C.steeld) + circ(-5.08, -0.02, 0.04, C.steeld);
      for (const y of [1.22, 4.28]) {
        g += rect(-3.72, y, -2.08, y + 0.3, C.steel, C.steeld, 0.025);
        for (const bx of [-3.55, -3.2, -2.6, -2.25]) g += circ(bx, y + 0.15, 0.04, C.steeld);
      }
      g += rect(-3.95, 4.12, -3.7, 4.56, C.steel, C.steeld, 0.025);
      g += circ(-3.83, 4.22, 0.04, C.steeld) + circ(-3.83, 4.46, 0.04, C.steeld);
      const slide = (1 - s.buttress) * 1.2;
      o += `<g ${op(s.buttress)}><g transform="translate(${f(-slide)} 0)">${g}</g>` +
           `<g transform="scale(-1 1) translate(${f(-slide)} 0)">${g}</g></g>`;
    }

    // --- Hung curtain (falls during the overload)
    const hungOp = Math.min(1, s.curtain * 2);
    if (hungOp > 0.001) {
      let g = "";
      g += `<path d="${P(curtainPts)}" fill="${C.fred}"/>`;
      let folds = "";
      for (const x of [0.35, 1.25, 2.15, 3.05, 3.95]) folds += rect(FL + x, FB - 0.2, FL + x + 0.22, FT, "#000", "none", 0, 'opacity="0.1"');
      for (const x of [0.75, 1.65, 2.55, 3.45]) folds += rect(FL + x, FB - 0.2, FL + x + 0.12, FT, "#fff", "none", 0, 'opacity="0.1"');
      g += `<g clip-path="url(#clipCurtain)">${folds}</g>`;
      g += path(P(curtainPts), "none", C.fredD, 0.035);
      g += path(P(star(FL + 5 * U, FT - 5 * U, 3 * U)), C.fyel, "none", 0);
      for (const [gx, gy, rot] of [[10,2,120.96],[12,4,98.13],[12,7,74.05],[10,9,51.34]])
        g += path(P(star(FL + gx * U, FT - gy * U, U, rot)), C.fyel, "none", 0);
      for (let x = 0.1; x <= 4.5; x += 0.65) g += `<circle cx="${f(FL + x)}" cy="${f(FT + 0.08)}" r="0.08" fill="${C.stone}" stroke="${C.rod}" stroke-width="0.025"/>`;

      g += circ(FL - 0.3, FT + 0.12, 0.1, C.rod) + circ(FL + 30 * U + 0.3, FT + 0.12, 0.1, C.rod);
      const dy = -s.drop * 2.0, rot = -2 - s.drop * 5;
      o += `<g ${op(hungOp)} transform="translate(0 ${f(dy)}) rotate(${f(rot)} -1.5 4.7)">${g}</g>`;
    }

    // --- Flag cast on the ground
    const heapOp = Math.max(0, s.heap * 2 - 1);
    if (heapOp > 0.001) {
      const hd = smoothClosed(heapPts);
      let g = `<path d="${hd}" fill="${C.fred}"/>`;
      let inner = "";
      for (const [t, bb] of [[-2.9, -2.65], [-1.5, -1.75], [-0.3, -0.05]])
        inner += `<path d="M${f(t - 0.12)} 0.8C${f(t)} 0.3 ${f(bb - 0.1)} 0.1 ${f(bb - 0.18)} -0.3L${f(bb + 0.18)} -0.3C${f(bb + 0.1)} 0.1 ${f(t + 0.15)} 0.3 ${f(t + 0.12)} 0.8Z" fill="#000" opacity="0.13"/>`;
      inner += path(P(star(-3.6, 0.15, 0.31, 14)), C.fyel, "none", 0);
      for (const [px, py, rr] of [[-3.05,0.42,105],[-2.95,0.1,80],[-2.38,0.22,62],[-2.2,-0.02,130]])
        inner += path(P(star(px, py, 0.11, rr)), C.fyel, "none", 0);
      g += `<g clip-path="url(#clipHeap)">${inner}</g>`;
      g += `<path d="${hd}" fill="none" stroke="${C.fredD}" stroke-width="0.035"/>`;
      g += line([[-0.4, 0.05], [2.9, -0.28]], C.rod, 0.075);
      g += circ(-0.45, 0.055, 0.1, C.rod) + circ(2.95, -0.285, 0.1, C.rod);
      g += `<circle cx="1.6" cy="-0.3" r="0.08" fill="${C.stone}" stroke="${C.rod}" stroke-width="0.025"/>`;
      g += `<circle cx="3.4" cy="-0.15" r="0.08" fill="${C.stone}" stroke="${C.rod}" stroke-width="0.025"/>`;
      o += `<g ${op(heapOp)}>${g}</g>`;
    }

    svg.innerHTML = DEFS + `<g transform="scale(1 -1)">${o}</g>`;
  }

  // ================================================================ navigation and animation
  const svg = document.getElementById("scene");
  const slideEl = document.getElementById("slide");
  const subdotsEl = document.getElementById("subdots");
  const subcountEl = document.getElementById("subcount");
  const stepsEl = document.getElementById("steps");
  const prevBtn = document.getElementById("prev");
  const nextBtn = document.getElementById("next");
  const playBtn = document.getElementById("play");
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  let pos = 0, stageIdx = 0;
  let current = full(0), from = current, target = current, t0 = 0, animating = false;
  let playing = false, holdTimer = null;
  const DURATION = 1700, HOLD = 6000;
  const ease = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;

  STAGES.forEach((st, i) => {
    const li = document.createElement("li");
    const n = SLIDES.filter(x => x.stage === i).length;
    li.innerHTML = `<button type="button" data-i="${i}"><span class="dot">${i + 1}</span><span class="minidots" aria-hidden="true">${"<i></i>".repeat(n)}</span><span class="name">${st.name}</span></button>`;
    stepsEl.appendChild(li);
  });
  stepsEl.addEventListener("click", e => {
    const b = e.target.closest("button[data-i]");
    if (b) { stopPlay(); goTo(SLIDES.findIndex(s => s.stage === +b.dataset.i)); }
  });
  subdotsEl.addEventListener("click", e => {
    const b = e.target.closest("button[data-pos]");
    if (b) { stopPlay(); goTo(+b.dataset.pos); }
  });

  function showSlide() {
    const s = SLIDES[pos];
    const top = /sources|split|tiles|lane|prio|dials|race|collage|imgs3|rise|big|pts|<div>/.test(s.body.slice(0, 40)) ? " top" : "";
    slideEl.innerHTML = `<p class="kicker">${s.kicker}</p><h2>${s.title}</h2><div class="body${top}">${s.body}</div>`;
    slideEl.scrollTop = 0;
    if (!reduceMotion) { slideEl.classList.remove("fade-in"); void slideEl.offsetWidth; slideEl.classList.add("fade-in"); }
    const siblings = SLIDES.map((x, i) => [x, i]).filter(([x]) => x.stage === s.stage);
    subdotsEl.innerHTML = siblings.map(([, i]) =>
      `<button type="button" data-pos="${i}" aria-label="Slide ${i + 1}" ${i === pos ? 'aria-current="true"' : ""}></button>`).join("");
    const k = siblings.findIndex(([, i]) => i === pos);
    subcountEl.textContent = `${STAGES[s.stage].name} · ${k + 1} of ${siblings.length}`;
    prevBtn.disabled = pos === 0;
    nextBtn.disabled = pos === SLIDES.length - 1;
    stepsEl.querySelectorAll("button").forEach((b, i) =>
      i === s.stage ? b.setAttribute("aria-current", "step") : b.removeAttribute("aria-current"));
    // light up the sub-page dots: done, current, still to come
    stepsEl.querySelectorAll(".minidots").forEach((m, i) => {
      const idx = SLIDES.map((x, j) => [x, j]).filter(([x]) => x.stage === i).map(([, j]) => j);
      m.querySelectorAll("i").forEach((d, k) => { d.className = idx[k] === pos ? "on" : idx[k] < pos ? "seen" : ""; });
    });
    svg.setAttribute("aria-label", "The NPT temple: " + STAGES[s.stage].name);
  }

  function goTo(p) {
    pos = Math.max(0, Math.min(SLIDES.length - 1, p));
    showSlide();
    const st = SLIDES[pos].stage;
    if (st !== stageIdx) {
      stageIdx = st;
      from = { ...current };
      target = full(st);
      if (reduceMotion) { current = target; render(current); }
      else { t0 = performance.now(); if (!animating) { animating = true; requestAnimationFrame(tick); } }
    }
    if (playing) schedule();
  }

  function tick(now) {
    const t = Math.min(1, (now - t0) / DURATION), e = ease(t);
    current = Object.fromEntries(KEYS.map(k => [k, from[k] + (target[k] - from[k]) * e]));
    render(current);
    if (t < 1) requestAnimationFrame(tick); else animating = false;
  }

  function schedule() {
    clearTimeout(holdTimer);
    if (pos >= SLIDES.length - 1) { stopPlay(); return; }
    holdTimer = setTimeout(() => goTo(pos + 1), HOLD);
  }
  function startPlay() {
    playing = true; playBtn.textContent = "Pause";
    if (pos >= SLIDES.length - 1) goTo(0); else goTo(pos + 1);
  }
  function stopPlay() { playing = false; clearTimeout(holdTimer); playBtn.textContent = "Play"; }

  prevBtn.addEventListener("click", () => { stopPlay(); goTo(pos - 1); });
  nextBtn.addEventListener("click", () => { stopPlay(); goTo(pos + 1); });
  playBtn.addEventListener("click", () => playing ? stopPlay() : startPlay());
  document.addEventListener("keydown", e => {
    if (e.key === "ArrowRight" || e.key === "PageDown") { stopPlay(); goTo(pos + 1); }
    else if (e.key === "ArrowLeft" || e.key === "PageUp") { stopPlay(); goTo(pos - 1); }
    else if (e.key === " " && e.target === document.body) { e.preventDefault(); playing ? stopPlay() : startPlay(); }
  });

  render(current);
  showSlide();
})();
